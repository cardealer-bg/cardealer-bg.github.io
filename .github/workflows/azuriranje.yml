name: Ažuriraj liste

on:
  workflow_dispatch:             # dugme "Run workflow" (Goran, bilo kada)
    inputs:
      proba:
        description: "Samo proba (ništa se ne objavljuje)"
        type: boolean
        default: false
  schedule:
    - cron: "20 6 * * *"         # 07:20 / 08:20 po beogradskom vremenu
    - cron: "20 15 * * *"        # 16:20 / 17:20 po beogradskom vremenu

permissions:
  contents: write

concurrency:
  group: azuriranje
  cancel-in-progress: false

jobs:
  azuriraj:
    # radi na računaru u kancelariji/kod kuće (Mac, mrežna veza koju Polovni ne blokiraju);
    # instalacija: curl -fsSL https://cardealer-bg.github.io/tools/mac-runner.sh | bash
    runs-on: [self-hosted, cardealer]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Alati
        run: |
          V="$HOME/cardealer-runner/venv"
          "$V/bin/pip" install -q playwright pypdf
          "$V/bin/python" -m playwright install chromium
          echo "$V/bin" >> "$GITHUB_PATH"
          npm install -s --prefix "$HOME/cardealer-runner/qr" qrcode-terminal@0.12.0
          rm -rf /tmp/rad

      - name: Čitanje oglasa sa Polovnih automobila
        id: scrape
        run: |
          set +e
          python tools/scrape.py /tmp/rad
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ $code -ne 0 ]; then
            echo "### Polovni automobili nisu mogli da se učitaju. Ništa nije menjano." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Poređenje, PDF liste i sajt
        run: |
          set +e
          export QR_LIB="$HOME/cardealer-runner/qr/node_modules/qrcode-terminal/vendor/QRCode"
          python tools/update.py /tmp/rad
          code=$?
          cat /tmp/rad/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Objavljivanje
        if: ${{ !inputs.proba }}
        run: |
          git config user.name "CAR DEALER liste"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html data pdf logo.png manifest.webmanifest sw.js icon-192.png icon-512.png favicon.ico
          git commit -m "Provera oglasa $(TZ=Europe/Belgrade date +%d.%m.%Y.\ %H:%M) (GitHub)" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 10
          done

      - name: Radni fajlovi (za proveru)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rad
          path: /tmp/rad
          retention-days: 7
