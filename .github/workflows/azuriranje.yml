name: Ažuriraj liste

on:
  workflow_dispatch:             # dugme "Run workflow" (Goran, bilo kada)
    inputs:
      proba:
        description: "Samo proba (ništa se ne objavljuje)"
        type: boolean
        default: false
  schedule:
    - cron: "20 6 * * *"         # 07:20 / 08:20 po beogradskom vremenu
    - cron: "20 15 * * *"        # 16:20 / 17:20 po beogradskom vremenu

permissions:
  contents: write

concurrency:
  group: azuriranje
  cancel-in-progress: false

jobs:
  azuriraj:
    # radi na računaru kod kuće (Mac ili Windows; mrežna veza koju Polovni ne blokiraju);
    # instalacija Mac:     curl -fsSL https://cardealer-bg.github.io/tools/mac-runner.sh | bash
    # instalacija Windows: irm https://cardealer-bg.github.io/tools/win-runner.ps1 | iex
    runs-on: [self-hosted, cardealer]
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Alati
        run: |
          if command -v cygpath >/dev/null; then   # Windows (Git Bash)
            R="$(cygpath -m "$USERPROFILE")/cardealer-runner"; BIN="$R/venv/Scripts"
            RAD="$(cygpath -m "$RUNNER_TEMP")/rad"; cygpath -w "$BIN" >> "$GITHUB_PATH"
          else                                     # Mac
            R="$HOME/cardealer-runner"; BIN="$R/venv/bin"
            RAD="$RUNNER_TEMP/rad"; echo "$BIN" >> "$GITHUB_PATH"
          fi
          "$BIN/python" -m pip install -q playwright pypdf tzdata
          "$BIN/python" -m playwright install chromium
          npm install -s --prefix "$R/qr" qrcode-terminal@0.12.0
          rm -rf "$RAD"
          echo "R=$R" >> "$GITHUB_ENV"; echo "RAD=$RAD" >> "$GITHUB_ENV"

      - name: Čitanje oglasa sa Polovnih automobila
        id: scrape
        run: |
          set +e
          python tools/scrape.py "$RAD"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ $code -ne 0 ]; then
            echo "### Polovni automobili nisu mogli da se učitaju. Ništa nije menjano." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Poređenje, PDF liste i sajt
        run: |
          set +e
          export QR_LIB="$R/qr/node_modules/qrcode-terminal/vendor/QRCode"
          python tools/update.py "$RAD"
          code=$?
          cat "$RAD/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Objavljivanje
        if: ${{ !inputs.proba }}
        run: |
          git config user.name "CAR DEALER liste"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html data pdf logo.png manifest.webmanifest sw.js icon-192.png icon-512.png favicon.ico
          KAD=$(python -c "from datetime import datetime;from zoneinfo import ZoneInfo;print(datetime.now(ZoneInfo('Europe/Belgrade')).strftime('%d.%m.%Y. %H:%M'))")
          git commit -m "Provera oglasa $KAD ($RUNNER_NAME)" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 10
          done

      - name: Radni fajlovi (za proveru)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rad
          path: ${{ runner.temp }}/rad
          retention-days: 7
