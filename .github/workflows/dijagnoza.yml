name: Dijagnoza ažuriranja

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dijagnoza:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isti koraci kao ažuriranje, sa zapisom
        env:
          QR_LIB: /tmp/qr/node_modules/qrcode-terminal/vendor/QRCode
        run: |
          set +e
          L=/tmp/log.txt
          step(){ echo "===== $1" >>$L; shift; ( "$@" ) >>$L 2>&1; echo "===== exit $?" >>$L; }
          step pip pip install playwright==1.47.0 pypdf==5.0.1
          step browser python -m playwright install --with-deps chromium
          step fonts sudo apt-get install -y fonts-dejavu-core fonts-liberation
          step npm npm install --prefix /tmp/qr qrcode-terminal@0.12.0
          step scrape python tools/scrape.py /tmp/rad
          step update python tools/update.py /tmp/rad
          ls -la /tmp/rad >>$L 2>&1; cat /tmp/rad/report.md >>$L 2>&1
          python3 - <<'PY'
          import re
          t=open("/tmp/log.txt",errors="replace").read()
          parts=re.split(r"^===== ",t,flags=re.M)
          for p in parts:
              if not p.strip(): continue
              msg=p[-3000:].replace("%","%25").replace("\r","").replace("\n","%0A")
              print("::warning title=dijag::"+msg)
          PY
          gh auth status >/dev/null 2>&1; echo "::warning title=token::$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/${{ github.repository }})"
