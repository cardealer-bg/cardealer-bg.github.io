name: Dijagnoza ažuriranja

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dijagnoza:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isti koraci kao ažuriranje, sa zapisom
        env:
          QR_LIB: /tmp/qr/node_modules/qrcode-terminal/vendor/QRCode
        run: |
          set +e
          L=/tmp/log.txt
          step(){ echo "===== $1" >>$L; shift; ( "$@" ) >>$L 2>&1; echo "===== exit $?" >>$L; }
          step pip pip install playwright==1.47.0 pypdf==5.0.1
          step browser python -m playwright install --with-deps chromium
          step fonts sudo apt-get install -y fonts-dejavu-core fonts-liberation
          step npm npm install --prefix /tmp/qr qrcode-terminal@0.12.0
          step scrape python tools/scrape.py /tmp/rad
          step update python tools/update.py /tmp/rad
          ls -la /tmp/rad >>$L 2>&1; cat /tmp/rad/report.md >>$L 2>&1
          git config user.name "CAR DEALER liste"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp $L /tmp/out/log.txt
          cp -r /tmp/rad /tmp/out/rad 2>/dev/null
          cd /tmp/out && git init -q -b dijagnoza && git add -A && git commit -qm "dijagnoza $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dijagnoza
